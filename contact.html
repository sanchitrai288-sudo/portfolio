<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me - Student Portfolio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            color: #1f2937;
            line-height: 1.7;
        }
        body > center {
            padding: 30px 0 10px;
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            color: #111827;
        }
        nav {
            margin-top: 12px;
            font-size: 0.95rem;
        }
        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #4f46e5;
            font-weight: 600;
        }
        nav a:hover {
            color: #312e81;
            text-decoration: underline;
        }
        main {
            max-width: 900px;
            margin: 0 auto 40px;
            padding: 24px 28px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        h3 {
            color: #111827;
            margin: 20px 0 10px;
        }
        p {
            margin: 0 0 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }
        input, select, textarea {
            width: 100%;
            max-width: 480px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 12px;
            background: #fff;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: #fff;
            cursor: pointer;
            margin-right: 8px;
        }
        button:hover {
            background: #4338ca;
        }
        button[type="reset"] {
            background: #6b7280;
        }
        button[type="reset"]:hover {
            background: #4b5563;
        }
        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, #dbeafe, #c7d2fe, #dbeafe);
            margin: 22px 0;
        }
    </style>
</head>
<body>
     <center>
        <h1>Contact Me</h1>
        <nav style="margin-top:12px; font-size:0.95rem;">
            <a href="index.html" style="margin:0 10px;">Home</a>
            <a href="about.html" style="margin:0 10px;">About Me</a>
            <a href="skills.html" style="margin:0 10px;">Projects & Skills</a>
            <a href="contact.html" style="margin:0 10px;">Contact</a>
        </nav></center>
    <main>
        <hr>
        <hr>
        <h3>Contact Me</h3>
        <p>If you would like to get in touch with me, please fill out the form below:</p>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Your Name"><br><br>
        <label for="email">Email:</label> 
        <input type="email" id="email" placeholder="Your Email"><br><br>
        <label for="number">Phone Number:</label>
        <input type="tel" id="number" placeholder="Your Phone Number"><br><br>
        <label for="gender">Gender:</label>
        <select id="gemder">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br>
        <label for="message">Message:</label><br>  
        <textarea id="message" rows="4" cols="50" placeholder="Your Message"></textarea><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <br><br>
    </main>
</body>
</html>
